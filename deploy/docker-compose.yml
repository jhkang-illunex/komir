# komir services/ 오케스트레이션 — Docker Compose 버전(로컬 개발·테스트 편의용).
# ⚠ airgap 운영 배포의 정본은 podman-compose.yml(§7, podman save/load 흐름)이다 —
# 이 파일은 로컬에서 docker/docker-compose로 빠르게 기동해볼 때만 쓴다. 서비스 구성은
# 두 파일이 항상 동일해야 한다(수정 시 양쪽 다 반영할 것 — 설계 단계라 자동 생성 없음).
# 정형DB(Postgres)·LLM/임베딩 서버는 여기 정의하지 않는다 — 전부 외부 서비스, .env로만
# 참조. 예외 — qdrant: 벡터DB는 komir이 직접 소유·기동(2026-08-05 결정, §0·§4·§7).
#
# 차이점(podman-compose.yml 대비): build 키가 `containerfile`이 아니라 표준 Docker
# Compose 키인 `dockerfile`(파일명이 실제로는 Containerfile이어도 무관 — 경로만 지정).
#
# TODO(구현 단계): geo/docker-compose.yml의 host.docker.internal:host-gateway 패턴
# (호스트측 로컬 LLM 접속)을 필요 서비스에 이식.

version: "3.9"

services:
  qdrant:
    image: docker.io/qdrant/qdrant:latest   # airgap: build_images.sh가 연결망에서 미리 pull
    environment:
      - QDRANT__TELEMETRY_DISABLED=true      # airgap 필수(§7) — 기본값은 익명 텔레메트리 전송
    volumes:
      - qdrant_data:/qdrant/storage           # 재기동 시 인덱스 유실 방지
    ports:
      - "6333:6333"
    restart: unless-stopped

  commodity-api:
    build:
      context: ..
      dockerfile: services/commodity_api/Containerfile
    env_file: [.env]
    ports:
      - "8001:8001"
    restart: unless-stopped

  rag-chat:
    build:
      context: ..
      dockerfile: services/rag_chat/Containerfile
    env_file: [.env]
    depends_on: [qdrant]
    ports:
      - "8002:8002"
    restart: unless-stopped

  report-gen:
    build:
      context: ..
      dockerfile: services/report_gen/Containerfile
    env_file: [.env]
    depends_on: [qdrant]
    ports:
      - "8003:8003"
    restart: unless-stopped

volumes:
  qdrant_data:

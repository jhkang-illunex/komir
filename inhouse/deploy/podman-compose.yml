# komir services/ 오케스트레이션 — airgap 운영 배포의 정본(설계 단계 스켈레톤,
# docs/CONTAINER_ARCHITECTURE.md §7). 로컬 개발·테스트엔 같은 폴더의 docker-compose.yml을
# 대신 써도 된다(구성 동일, build 키 표기만 다름) — 수정 시 두 파일 다 반영할 것.
# 정형DB(Postgres)·LLM/임베딩 서버는 여기 정의하지 않는다 — 전부 외부 서비스, .env로만
# 참조(airgap 이미지를 가볍게 유지하고, 운영 DB/LLM은 별도 관리 주체가 소유하는 구조
# 전제). 예외 — qdrant: 벡터DB는 komir이 직접 소유·기동(2026-08-05 결정, §0·§4·§7).
#
# TODO(구현 단계): geo/docker-compose.yml의 host.docker.internal:host-gateway 패턴
# (호스트측 로컬 LLM 접속)을 필요 서비스에 이식.
#
# rag-chat·report-gen의 `environment: LLM_BASE_URL=...` — 지금은 두 서비스가 같은
# LLM_BASE_URL(단일 모델 인스턴스)을 공유한다(2026-08-13 논의, 발주처 배포 디바이스
# 미확정이라 분리 여부 보류). RAG_CHAT_LLM_BASE_URL·REPORT_GEN_LLM_BASE_URL(.env,
# 기본 공백)이 채워지면 그 값으로, 비어 있으면 공용 LLM_BASE_URL로 자동 폴백한다
# (`${VAR:-$LLM_BASE_URL}`) — 물리 분리를 결정하면 .env 두 줄만 채우면 되고 compose
# 파일·코드는 그대로 둔다. podman-compose(python 구현, v1.6.0) `${A:-$B}` 중첩 치환
# 실측 검증 완료(2026-08-13) — 내부 var_interpolate()를 직접 호출해 공용폴백·개별
# 오버라이드·미설정 3케이스 전부 docker compose v2와 동일 결과 확인. CLI(podman-compose
# config)는 이 환경에 podman 바이너리 자체가 없어 못 돌렸으나, CLI가 쓰는 것과 동일한
# 치환 함수로 검증했으므로 결론엔 영향 없음.

version: "3.9"

services:
  qdrant:
    image: docker.io/qdrant/qdrant:latest   # airgap: build_images.sh가 연결망에서 미리 pull
    environment:
      - QDRANT__TELEMETRY_DISABLED=true      # airgap 필수(§7) — 기본값은 익명 텔레메트리 전송
    volumes:
      - qdrant_data:/qdrant/storage           # 재기동 시 인덱스 유실 방지
    ports:
      - "6333:6333"
    restart: unless-stopped

  commodity-api:
    build:
      context: ..
      containerfile: services/commodity_api/Containerfile
    env_file: [.env]
    ports:
      - "8001:8001"
    restart: unless-stopped

  rag-chat:
    build:
      context: ..
      containerfile: services/rag_chat/Containerfile
    env_file: [.env]
    environment:
      - LLM_BASE_URL=${RAG_CHAT_LLM_BASE_URL:-$LLM_BASE_URL}
    depends_on: [qdrant]
    ports:
      - "8002:8002"
    restart: unless-stopped

  report-gen:
    build:
      context: ..
      containerfile: services/report_gen/Containerfile
    env_file: [.env]
    environment:
      - LLM_BASE_URL=${REPORT_GEN_LLM_BASE_URL:-$LLM_BASE_URL}
    depends_on: [qdrant]
    ports:
      - "8003:8003"
    restart: unless-stopped

  # 파일 기반 보고서 정제·색인 주간 배치(2026-08-27, §5-3 "미구현" 항목의 구현) —
  # 다른 3개 서비스와 달리 documents/·data_lake/semi_structure/를 직접 읽고 써야 해서
  # 볼륨 마운트가 필요하다. 스케줄은 .env의 INGESTION_SCHEDULE_CRON.
  ingestion:
    build:
      context: ..
      containerfile: ingest/Containerfile
    # supercronic이 PID 1로 직접 실행되면(entrypoint.sh가 exec로 자리를 넘김) 이
    # 환경(볼륨 마운트가 있는 조건, 2026-08-27 실측 재현, docker-compose.yml에서
    # 검증)에서 내장 프로세스 reaping이 "Failed to fork exec: no such file or
    # directory"로 즉시 죽는 버그가 있다 — init: true(컨테이너 내장 tini를 PID 1로
    # 둠)로 우회한다. podman-compose(python 구현)가 이 키를 무시하면 `podman run
    # --init` 동등 옵션을 배포 스크립트에서 직접 줄 것.
    init: true
    env_file: [.env]
    environment:
      # .env의 PDF_MAXPAGES=40(geo GKG용)이 env_file로 주입되면 build_okf_documents.py의
      # setdefault(500)를 무력화한다 — 이 서비스에서만 상향(다른 서비스의 LLM_BASE_URL
      # 서비스별 오버라이드와 같은 패턴).
      - PDF_MAXPAGES=500
      - OCR_MAXPAGES=60
    volumes:
      - ../../documents:/komir/documents:ro
      - ../data_lake/semi_structure:/komir/inhouse/data_lake/semi_structure
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 호스트 LLM(.env LLM_BASE_URL) — geo compose 선례
    restart: unless-stopped

volumes:
  qdrant_data:

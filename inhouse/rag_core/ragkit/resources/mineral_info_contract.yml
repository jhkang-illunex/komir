# 광종정보 정규화 resource 계약. 값은 get_mineral_info adapter가 검증한 뒤에만
# 채운다. 화면 레지스트리의 mineral_info는 현재 recommendation_only이며, 이
# 파일 자체는 출처 없는 광물 특성·용도 값을 제공하지 않는다.
schema_version: 1
status: catalog_populated_properties_pending
source_page: mineral_info
source_registry: inhouse/rag_chat/app/page_recommend/resources/registry/pages/mineral_info.yaml
supported_questions:
  uses:
    output: "{광물}의 용도는 {용도1}, {용도2}, {용도3} 등에 사용됩니다."
    required_fields: [mineral, uses]
    rules:
      - uses must contain 1..3 source-verified values
      - preserve source ordering
  basic_properties:
    output: "{광물}의 원소 기호는 {원소기호}, 원자번호는 {원자번호}이며, 주요 특성은 {주요특성}입니다."
    required_fields: [mineral, element_symbol, atomic_number, characteristics]
    rules:
      - element_symbol and atomic_number must be source-verified
      - characteristics must be source-verified text, not model inference
  manganese_ore:
    output: "망간의 주요 광석은 {광석명}입니다."
    required_fields: [mineral, major_ores]
    rules:
      - only answer when mineral is 망간 and one or more source-verified ores exist
adapter_output:
  mineral: string
  uses: [string]
  element_symbol: string
  atomic_number: integer
  characteristics: [string]
  major_ores: [string]
  source_url: string
  source_published_at: date
fail_closed:
  - missing required field
  - unsupported mineral
  - unverified or DEV_DUMMY source
catalog_provenance:
  table: public.ai_mnrl_mst
  queried_at: "2026-09-27"
  property_table: public.ai_mnrl_sect
  property_rows_at_query: 0

schema_version: 1
page_id: notice_announcements
aliases: [announcements]
identity:
  section: "알림마당"
  name: "공지사항"
  page_kind: board
  navigation: {method: GET, target: /Komis/Board/NOTICE, params: {}}
  login_required: false
  external: false
screen:
  controls:
    - id: quick_period
      label: "빠른 기간"
      description: "전체·1개월·3개월·6개월·1년 버튼으로 조회 기간을 빠르게 설정할 수 있다."
      widget: radio
      role: shortcut
      target_filters: [period]
      transform: relative_date_range
      options:
        - {value: all, label: "전체", aliases: [전체]}
        - {value: 1_month, label: "1개월", aliases: [한달, 최근한달]}
        - {value: 3_months, label: "3개월", aliases: [최근3개월]}
        - {value: 6_months, label: "6개월", aliases: [반년, 최근6개월]}
        - {value: 1_year, label: "1년", aliases: [최근1년]}
      observed_default: all
routing:
  summary: "KOMIS 서비스 운영, 시스템 점검과 공공데이터 관련 공지를 조회하는 게시판"
  use_when:
    - "KOMIS 시스템 점검이나 서비스 운영 공지를 찾을 때"
    - "KOMIS 공공데이터 홍보·개방 안내를 찾을 때"
  do_not_use_when:
    - "광업요람·매뉴얼 같은 자료를 찾을 때"
    - "개별 문의를 등록하거나 기존 문의를 찾을 때"
  distinguish_from:
    - {page_id: notice_self_info, reason: "공지사항은 서비스 운영 안내이고 Self-Info는 광업자료·매뉴얼 게시판이다."}
    - {page_id: notice_qna, reason: "공지사항은 운영자가 게시하는 안내이고 Q&A는 이용자 문의 목록이다."}
  example_queries:
    - "KOMIS 시스템 점검 공지는 어디서 봐?"
    - "최근 공공데이터 관련 공지를 보여줘"
  keywords: [공지사항, 공지, 시스템점검, 서비스안내, 공공데이터, 운영공지]
filters:
  - id: period
    semantic_key: period
    label: "기간"
    type: date_range
    required: false
    default: all
    default_label: "전체 기간"
    options: []
    values_ref: null
    depends_on: []
    temporal: {granularity: day}
  - id: search_field
    semantic_key: search_field
    label: "검색 대상"
    type: enum
    required: false
    default: all
    default_label: "제목+내용"
    options:
      - {value: all, label: "제목+내용", aliases: [전체]}
      - {value: title, label: "제목", aliases: [제목만]}
      - {value: content, label: "내용", aliases: [본문]}
    values_ref: null
    depends_on: []
  - id: query
    semantic_key: query
    label: "검색어"
    type: text
    required: false
    default: null
    default_label: null
    options: []
    values_ref: null
    depends_on: []
  - id: page_size
    semantic_key: page_size
    label: "페이지 크기"
    type: integer
    required: false
    default: 15
    default_label: "15개"
    options:
      - {value: 5, label: "5개", aliases: []}
      - {value: 10, label: "10개", aliases: []}
      - {value: 15, label: "15개", aliases: []}
      - {value: 20, label: "20개", aliases: []}
      - {value: 40, label: "40개", aliases: []}
      - {value: 50, label: "50개", aliases: []}
    values_ref: null
    depends_on: []
outputs:
  available_data_labels: ["번호", "제목", "등록일", "조회수", "첨부파일 여부", "분류코드", "본문", "첨부파일", "이전 글", "다음 글"]
presentation:
  summary: "공지 목록을 표로 제공하고 상세에서 본문, 첨부파일과 이전·다음 글을 보여준다."
  panels:
    - {type: table, label: "공지사항 목록", description: "제목, 등록일, 조회수, 첨부 여부와 분류코드를 확인한다."}
    - {type: detail, label: "공지사항 상세", description: "본문, 첨부파일과 이전·다음 글을 확인한다."}
policies:
  recommendation_only: true
  mutation: read_only
  caveats:
    - "목록은 비로그인 조회가 가능하다."
    - "민원·국민제안·정책토론은 공지 화면에서 국민신문고 서비스로 안내한다."
    - '화면 필터는 period→srchStartDate/srchEndDate, search_field→srchField(전체="", 제목=ttl, 내용=cnts), query→srchValue, page_size→listCount로 전달된다.'
    - "목록 조회는 boardType=D, boardCd=NOTICE, regDate 내림차순을 사용하고 상세 조회는 getViewBoardDetail에 SEQ와 boardCd=NOTICE를 전달한다."
tool: {status: planned, planned_name: search_komis_board}
provenance:
  observed_at: "2026-07-27"
  sources: [artifacts/browser/page-probe/notice-pages.json, artifacts/browser/notice-probe/details.json]

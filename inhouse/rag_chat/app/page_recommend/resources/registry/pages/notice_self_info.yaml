schema_version: 1
page_id: notice_self_info
aliases: [self_info]
identity:
  section: "알림마당"
  name: "Self-Info"
  page_kind: board
  navigation: {method: GET, target: /Komis/Board/SELFINFO, params: {}}
  login_required: false
  external: false
screen:
  controls:
    - id: quick_period
      label: "빠른 기간"
      description: "전체·1개월·3개월·6개월·1년 버튼으로 조회 기간을 빠르게 설정할 수 있다."
      widget: radio
      role: shortcut
      target_filters: [period]
      transform: relative_date_range
      options:
        - {value: all, label: "전체", aliases: [전체]}
        - {value: 1_month, label: "1개월", aliases: [한달, 최근한달]}
        - {value: 3_months, label: "3개월", aliases: [최근3개월]}
        - {value: 6_months, label: "6개월", aliases: [반년, 최근6개월]}
        - {value: 1_year, label: "1년", aliases: [최근1년]}
      observed_default: all
routing:
  summary: "광업요람, KOMIS 이용 매뉴얼과 핵심광물 인포그래픽 등 자료를 조회하는 게시판"
  use_when:
    - "광업요람이나 KOMIS 이용 매뉴얼을 찾을 때"
    - "핵심광물 지수·공급망 지도·인포그래픽 자료를 찾을 때"
  do_not_use_when:
    - "광업행사·세미나 발표자료를 찾을 때"
    - "KOMIS 운영 공지나 시스템 점검 안내를 찾을 때"
  distinguish_from:
    - {page_id: notice_private_network, reason: "Self-Info는 일반 자료·매뉴얼 중심이고 민간협력 네트워크는 행사·세미나·해외 광업자료 중심이다."}
    - {page_id: notice_announcements, reason: "Self-Info는 자료 게시판이고 공지사항은 서비스 운영 안내 게시판이다."}
  example_queries:
    - "최신 광업요람은 어디서 받아?"
    - "핵심광물 인포그래픽 자료를 찾고 싶어"
  keywords: [Self-Info, 셀프인포, 광업요람, 이용매뉴얼, 핵심광물, 인포그래픽]
filters:
  - id: period
    semantic_key: period
    label: "기간"
    type: date_range
    required: false
    default: all
    default_label: "전체 기간"
    options: []
    values_ref: null
    depends_on: []
    temporal: {granularity: day}
  - id: search_field
    semantic_key: search_field
    label: "검색 대상"
    type: enum
    required: false
    default: all
    default_label: "제목+내용"
    options:
      - {value: all, label: "제목+내용", aliases: [전체]}
      - {value: title, label: "제목", aliases: [제목만]}
      - {value: content, label: "내용", aliases: [본문]}
    values_ref: null
    depends_on: []
  - id: query
    semantic_key: query
    label: "검색어"
    type: text
    required: false
    default: null
    default_label: null
    options: []
    values_ref: null
    depends_on: []
  - id: page_size
    semantic_key: page_size
    label: "페이지 크기"
    type: integer
    required: false
    default: 15
    default_label: "15개"
    options:
      - {value: 5, label: "5개", aliases: []}
      - {value: 10, label: "10개", aliases: []}
      - {value: 15, label: "15개", aliases: []}
      - {value: 20, label: "20개", aliases: []}
      - {value: 40, label: "40개", aliases: []}
      - {value: 50, label: "50개", aliases: []}
    values_ref: null
    depends_on: []
outputs:
  available_data_labels: ["번호", "제목", "등록일", "조회수", "본문", "첨부파일", "이전 글", "다음 글"]
presentation:
  summary: "자료 목록을 표로 제공하고 상세에서 본문, 첨부파일과 이전·다음 글을 보여준다."
  panels:
    - {type: table, label: "Self-Info 목록", description: "제목, 등록일과 조회수를 확인한다."}
    - {type: detail, label: "자료 상세", description: "본문, 첨부파일과 이전·다음 글을 확인한다."}
policies:
  recommendation_only: true
  mutation: read_only
  caveats:
    - "목록은 비로그인 조회가 가능하며 첨부파일은 상세 화면에서 확인한다."
    - '화면 필터는 period→srchStartDate/srchEndDate, search_field→srchField(전체="", 제목=ttl, 내용=cnts), query→srchValue, page_size→listCount로 전달된다.'
    - "목록 조회는 boardType=D, boardCd=SELFINFO, regDate 내림차순을 사용하고 상세 조회는 getViewBoardDetail에 SEQ와 boardCd=SELFINFO를 전달한다."
tool: {status: planned, planned_name: search_komis_board}
provenance:
  observed_at: "2026-07-27"
  sources: [artifacts/browser/page-probe/notice-pages.json, artifacts/browser/notice-probe/details.json]

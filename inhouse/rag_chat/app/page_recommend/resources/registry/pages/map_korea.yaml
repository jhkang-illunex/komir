schema_version: 1
page_id: map_korea
aliases: [korea_trade, korea_mineral_trade]
identity:
  section: "핵심광물지도"
  name: "대한민국 수급지도"
  page_kind: data
  navigation: {method: GET, target: /Komis/MnrlMap/Korea, params: {}}
  login_required: false
  external: false
screen:
  controls:
    - id: mineral_selector
      label: "광종"
      description: "광종 전체 또는 지원 광종을 선택할 수 있다."
      widget: select
      role: direct
      native_name: srchMnrkndUnqCd
      target_filters: [mineral]
      options:
        - {value: all, label: "광종 전체", aliases: [전체]}
      values_ref: metadata.maps.trade_minerals
    - id: hs_code_query
      label: "HS Code 텍스트 검색"
      description: "HS Code 검색어로 후보를 찾은 뒤 실제 HS Code 항목을 선택한다."
      widget: text_search
      role: lookup
      native_name: srchTextHsCd
      target_filters: [hs_code]
      transform: lookup_selection
routing:
  summary: "한국의 광종별 국가별 수입·수출 금액과 중량을 HS 10자리 기준으로 보여주는 페이지"
  use_when:
    - "한국이 특정 광물을 어느 국가에서 얼마나 수입하거나 수출하는지 볼 때"
    - "국가별 교역 금액·중량·점유율·순위와 기간별 추이를 찾을 때"
  do_not_use_when:
    - "전 세계 국가 간 교역 경로를 찾을 때"
    - "합성 수급리스크와 수입의존도 지표를 찾을 때"
  distinguish_from:
    - {page_id: map_global, reason: "대한민국 수급지도는 한국을 기준으로 한 HS 10자리 교역이고 글로벌 수급지도는 국가 간 HS 6자리 교역이다."}
    - {page_id: indicator_supply, reason: "대한민국 수급지도는 실제 교역량·금액이고 수급동향지표는 합성 위험지표와 배경 패널이다."}
  example_queries:
    - "한국의 리튬 수입량을 국가별로 어디서 봐?"
    - "지난해 코발트 수출금액 상위국을 보고 싶어"
  keywords: [대한민국, 한국, 수급지도, 수입, 수출, 교역, 국가별, 금액, 중량, 점유율, HS코드]
filters:
  - id: mineral
    semantic_key: mineral
    label: "광종"
    type: mineral
    required: true
    default: null
    default_label: null
    options: []
    values_ref: metadata.maps.trade_minerals
    depends_on: []
  - id: material_flow
    semantic_key: material_flow
    label: "생산품 유형"
    type: enum
    required: false
    default: all
    default_label: "생산품 유형 전체"
    options:
      - {value: all, label: "전체", aliases: [생산품전체]}
      - {value: "001", label: "기초원료", aliases: []}
      - {value: "002", label: "기초금속", aliases: []}
      - {value: "003", label: "가공금속", aliases: []}
      - {value: "004", label: "스크랩", aliases: [고철]}
    values_ref: null
    depends_on: [mineral]
  - id: material_flow_detail
    semantic_key: material_flow_detail
    label: "물질흐름 세부"
    type: enum
    required: false
    default: all
    default_label: "세부 전체"
    options: []
    values_ref: metadata.maps.material_flow_details
    depends_on: [mineral, material_flow]
  - id: hs_code
    semantic_key: hs_code
    label: "HS Code"
    type: enum
    required: false
    default: all
    default_label: "HS Code 전체"
    options: []
    values_ref: metadata.maps.korea_hs_codes
    depends_on: [mineral, material_flow, material_flow_detail]
  - id: trade_direction
    semantic_key: trade_direction
    label: "수입·수출 기준"
    type: enum
    required: false
    default: import
    default_label: "수입"
    options:
      - {value: import, label: "수입", aliases: [들여온, 수입국]}
      - {value: export, label: "수출", aliases: [내보낸, 수출국]}
    values_ref: null
    depends_on: []
  - id: country
    semantic_key: country
    label: "국가"
    type: country
    required: false
    default: all
    default_label: "국가 전체"
    options: []
    values_ref: metadata.information.all_countries
    depends_on: []
  - id: period_granularity
    semantic_key: granularity
    label: "기간 단위"
    type: enum
    required: false
    default: year
    default_label: "연도별"
    options:
      - {value: year, label: "연도별", aliases: [연간]}
      - {value: month, label: "월별", aliases: [월간]}
    values_ref: null
    depends_on: []
  - id: period
    semantic_key: period
    label: "조회 시점"
    type: date
    required: false
    default: latest
    default_label: "최신 확정 시점"
    options: []
    values_ref: metadata.maps.korea_available_periods
    depends_on: [period_granularity]
    temporal:
      granularity: year
      granularity_filter: period_granularity
      granularity_map: {year: year, month: month}
  - id: measure
    semantic_key: measure
    label: "정렬 관점"
    type: enum
    required: false
    default: amount
    default_label: "금액별"
    options:
      - {value: amount, label: "금액별", aliases: [금액, 달러]}
      - {value: weight, label: "중량별", aliases: [중량, 무게, 톤]}
    values_ref: null
    depends_on: []
  - id: amount_unit
    semantic_key: amount_unit
    label: "금액 표시 단위"
    type: enum
    required: false
    default: thousand_usd
    default_label: "천USD"
    options:
      - {value: thousand_usd, label: "천USD", aliases: [천달러]}
      - {value: usd, label: "USD", aliases: [달러]}
    values_ref: null
    depends_on: [measure]
    applies_when: {measure: [amount]}
  - id: weight_unit
    semantic_key: weight_unit
    label: "중량 표시 단위"
    type: enum
    required: false
    default: ton
    default_label: "TON"
    options:
      - {value: ton, label: "TON", aliases: [톤, t]}
      - {value: kg, label: "KG", aliases: [킬로그램]}
    values_ref: null
    depends_on: [measure]
    applies_when: {measure: [weight]}
outputs:
  available_data_labels: ["국가", "조회시점", "수입·수출 금액", "수입·수출 중량", "금액 점유율", "HS Code", "국가별 Top 5", "기간별 교역규모 추이"]
presentation:
  summary: "교역국에서 한국으로 향하는 지도, 기간별 추이 선, 국가별 Top 5 막대와 상세 표를 함께 제공한다."
  panels:
    - {type: flow_map, label: "대한민국 교역지도", description: "교역국과 한국 사이의 방향과 규모를 공간적으로 보여준다."}
    - {type: line, label: "수출입 규모 추이", description: "기간에 따른 수입·수출 규모 변화를 보여준다."}
    - {type: ranked_bar, label: "국가별 Top 5", description: "상위 교역국의 규모와 점유율을 빠르게 비교한다."}
    - {type: table, label: "국가별 상세", description: "금액·중량·점유율과 HS Code의 정확한 값을 확인한다."}
policies:
  recommendation_only: true
  mutation: read_only
  filter_defaults:
    mineral: {value: all, label: "광종 전체"}
  caveats:
    - "생산품 유형·물질흐름 세부·HS Code는 상위 필터에 종속되며 국내 교역은 HS 10자리 기준이다."
    - "월 자료와 연 자료의 확정 시점이 다르므로 최신은 동적 메타데이터로 해석한다."
tool: {status: planned, planned_name: get_korea_mineral_trade}
provenance:
  observed_at: "2026-07-16"
  sources: [docs/komis_service_catalog.md, docs/komis_tool_parameter_spec.md, docs/komis_visual_presentation_catalog.md, artifacts/browser/page-probe/pages.json, artifacts/browser/detail-probe/details.json]

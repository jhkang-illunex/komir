{
  "schema_version": 1,
  "suite_id": "komir-chatbot-acceptance-260923",
  "created_at": "2026-09-23",
  "designed_by": "Astra",
  "defaults": {
    "endpoint": "/pubchat",
    "timeout_seconds": 180,
    "isolated_session": true,
    "automatic_retry": 0
  },
  "result_statuses": [
    "PASS",
    "FAIL",
    "BLOCKED_DATA",
    "BLOCKED_ENV",
    "NOT_RUN"
  ],
  "contracts": {
    "terminal": [
      "HTTP 200 + SSE",
      "각 요청 done=true 터미널 이벤트 정확히 1개",
      "정상 UTF-8 JSON, 요청 session_id 보존, done 뒤 추가 결과 없음"
    ],
    "grounded_answer": [
      "abstained=false 또는 미설정, needs_clarification!=true",
      "비어있지 않은 delta 본문·citations",
      "해당 action/source 인용 연결; source family는 실제 경로 메타에서 확인",
      "표/차트가 있으면 헤더·행/series·data_ref·단위 일치",
      "Vector/PageIndex가 조회되더라도 모든 후보가 최종 인용될 필요는 없음"
    ],
    "clean_abstention": [
      "abstained=true + 사전 지정 이유 코드",
      "비어있지 않은 설명 delta",
      "citations·table·chart 비어 있음",
      "타임아웃·서버오류·generation_error를 데이터 없음 성공으로 인정하지 않음"
    ],
    "clarification": [
      "needs_clarification=true",
      "clarification.action_id=trade.indicator 및 누락 슬롯 목록",
      "숫자 답변·citations·table·chart 없음",
      "같은 session_id 후속 요청 가능"
    ],
    "page": [
      "done.mode=page",
      "기대 page_id가 recommendations 안에 존재",
      "public/profile 접근 정책 준수"
    ],
    "not_applicable": [
      "HTTP 요청 없이 모듈/읽기 전용 통합 검사; SSE는 해당 라이브 케이스에서 별도 검증"
    ]
  },
